                  - textbox [ref=e153]:
                    - heading "담당업무" [level=3] [ref=e154]
                    - paragraph [ref=e155]: 【 이런 일을 해요 】 1. 코드잇 메인 서비스 개발 및 운영 내부에서 만들어진 콘텐츠를 유저에게 제공하는 코드잇 메인 서비스의 API를 개발하고 운영합니다. 메인 서비스는 Spring Webflux, Kotlin을 사용하고, DB로는 MongoDB를 사용하고 있습니다. 프론트엔드와는 GraphQL을 사용하여 통신합니다. 유저의 가입, 결제, 강의 수강, 커뮤니티 등 코드잇 프로덕트의 모든 부분을 조금 더 나은 방향으로 계속해서 개선하고 있습니다. 2. 실행기 개발 및 운영 코드잇은 유저들이 별도의 실행 환경 없이 브라우저에서 코드를 입력하고 결과를 확인할 수 있는 실행기 서비스를 제공합니다. Python, JavaScript, Java, MySQL 등 다양한 언어와 실행 환경에 더해 브라우저에서 터미널을 사용하는 것도 지원하고 있습니다. 실행기가 빠르고 정확하면서, 동시에 효율적으로 동작하도록 개선합니다. 3. 인프라 관리 코드잇 메인 서비스와 실행기는 AWS 관리형 Kubernetes인 EKS에서 서비스되고 있습니다. 유저의 사용 패턴에 맞게 인프라를 효율적으로 사용하는 방식을 고민하고 개선합니다. 4. 데이터 분석 코드잇은 사용자의 데이터 분석을 통해 프로덕트의 개선 방향을 결정합니다. Amplitude, Google Analytics, 내부 DB를 활용하여 데이터를 모으고 가공하여 내부에 공유합니다. 【 이런 팀에서 일해요 】 코드잇 프로덕트 팀은 사용자에게 최고의 학습 경험을 제공하고, 회사의 지속적인 성장을 만들어 가는 팀입니다. 우리가 만드는 제품은 학습자가 몰입해 배우고 성장할 수 있는 기반이자, 회사가 더 큰 도약을 할 수 있게 하는 힘이라고 믿습니다. 팀은 스쿼드 단위로 운영됩니다. 각 스쿼드는 스스로 문제를 정의하고 해결책을 실행하며, 프로덕트 매니저·디자이너·엔지니어가 긴밀하게 협력해 목표를 달성합니다. 각자의 전문성이 존중받는 동시에, 모두가 한 방향을 바라보며 함께 고민하고 결정합니다. 우리의 협업 문화는 자유롭고 활발합니다. 누구나 의견을 자유롭게 제안할 수 있고, 중요한 순간에는 빠르게 결정해 실행으로 옮깁니다. 사용자 경험과 비즈니스 성장을 균형 있게 추구하며, 함께 배우고 성장하는 문화를 만들어가고 있습니다. 【 이런 기술 스택을 사용해요 】 Kotlin Spring Framework (WebFlux) GraphQL MongoDB Infrastructure Docker/Kubernetes CircleCI Terraform AWS (EKS, ECS, ECR, S3, SES…) *현재 스택에 맞지 않아도 괜찮아요 🙂 빠르게 배우고 열정 있는 백엔드 엔지니어라면 지원해 보세요! (GitHub 계정 제출 권장)
                    - paragraph [ref=e156]
                    - heading "자격요건" [level=3] [ref=e157]
                    - paragraph [ref=e158]: 【 이런 분을 찾고 있어요 】 알고리즘과 자료구조에 대한 이해를 갖추신 분 빠르게 학습하는 역량을 갖추신 분 코드잇의 비전에 공감하며, 원활한 커뮤니케이션 능력을 갖추신 분
                    - paragraph [ref=e159]
                    - heading "우대사항" [level=3] [ref=e160]
                    - paragraph [ref=e161]: 【 이런 분이면 더 좋아요 】 컴퓨터 과학과 또는 컴퓨터 공학과 출신이신 분 코드잇의 개발 스택(주요 업무에 기술됨)에 대한 전문성이 있으신 분 영어를 잘 하시는 분 (Bilingual일 경우 추가 우대) IT 스타트업에서 근무해보신 분
                    - paragraph [ref=e162]
                    - heading "혜택 및 복지" [level=3] [ref=e163]
                    - paragraph [ref=e164]: 1. 최고의 팀원에게 최고의 보상을 제공해요. 최고의 동료들이 모인 팀 최고 수준의 보상 지향 2. 몰입을 위한 최적의 환경을 지원해요. 주 40시간 유연근무제 및 자유로운 재택근무 직군별 최고 사양의 맥북과 모니터 제공, 장비지원금 별도 지원 도서, 교육 등 자기계발을 위한 비용 지원 동료 및 리더와의 상시 피드백 문화 3. 건강과 행복을 위한 복지를 제공해요. 점심, 저녁 식대 지원 (각 최대 12,000원) 무제한 간식 제공, 매년 명절 및 생일 축하 선물 연 100만원 상당의 종합 건강검진 지원 50만원 상당의 경조사비 지원 주차비 지원 4. 친밀한 문화를 함께 만들어가요. 신뢰를 바탕으로 한 반말 문화 랜덤점심, TGIM, 컬쳐나잇, 비어토크 사내 동아리 활동 지원 【 언론 속의 코드잇 】 코드잇 공동 대표가 1시간짜리 강의를 절대 안 만드는 이유 https://bit.ly/3oo5Cpy 코드잇 시리즈 B 투자유치, 누적 140억원 투자 https://bit.ly/3csFfvP 국내 코딩 교육 기업 최초로 멤버십 1만명 돌파 https://bit.ly/3BdkjmO 【 이렇게 합류하게 돼요 】 💡 서류 전형(AI 인터뷰 포함) → 1차 인터뷰 → 2차 인터뷰 → 합류 서류 전형 서류 검토 후 합격자에 한해 AI 인터뷰를 진행합니다. AI 인터뷰는 코드잇 케이드 서비스(비대면)를 통해 진행되며, 직무 이해도 및 적합성 검증을 위한 질문을 드려요. 1차 인터뷰 코드잇 사무실에서 진행되며, 테크 리드와 백엔드 엔지니어가 참여하여 대면 라이브 코딩 및 질의응답을 진행합니다. 2차 인터뷰 코드잇 사무실에서 진행되며, 직무와 컬쳐핏 인터뷰를 나눠서 진행합니다. 직무 인터뷰는 실무진이 참여하며, 컬쳐핏 인터뷰는 경영진이 참여합니다. 2차 인터뷰는 100분 내외로 진행될 예정입니다. 2차 인터뷰 이후 레퍼런스 체크를 진행할 수 있어요. 레퍼런스 체크는 지원자 분의 동의를 구하고, 진행 방식, 기한 등에 대해 사전에 상세히 안내드린 후에 진행합니다. 지원자에 따라 해당 절차를 생략할 수 있습니다. 【 참고해 주세요 】 수습 기간은 3개월이며, 수습 기간 평가 결과에 따라 수습 기간이 연장될 수 있습니다. 수습 기간에도 급여는 동일하게 100% 지급됩니다. 【 이렇게 지원해 주세요 】 📤 지원하기 버튼을 눌러 다음 서류를 제출해 주세요. (필수) 이력서 (필수) 코드잇에 지원하시게 된 동기를 알려주세요. (선택) GitHub, 블로그 등 포트폴리오
