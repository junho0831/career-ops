                - paragraph [ref=e1241]: "Career-Ops turns any AI coding CLI into a full job search command center. Instead of manually tracking applications in a spreadsheet, you get an AI-powered pipeline that:"
                - list [ref=e1242]:
                  - listitem [ref=e1243]:
                    - strong [ref=e1244]: Evaluates offers
                    - text: with a structured A-F scoring system (10 weighted dimensions)
                  - listitem [ref=e1245]:
                    - strong [ref=e1246]: Generates tailored PDFs
                    - text: "-- ATS-optimized CVs customized per job description"
                  - listitem [ref=e1247]:
                    - strong [ref=e1248]: Scans portals
                    - text: automatically (Greenhouse, Ashby, Lever, company pages)
                  - listitem [ref=e1249]:
                    - strong [ref=e1250]: Processes in batch
                    - text: "-- evaluate 10+ offers in parallel with sub-agents"
                  - listitem [ref=e1251]:
                    - strong [ref=e1252]: Tracks everything
                    - text: in a single source of truth with integrity checks
                - blockquote [ref=e1253]:
                  - paragraph [ref=e1254]:
                    - strong [ref=e1255]: "Important: This is NOT a spray-and-pray tool."
                    - text: Career-ops is a filter -- it helps you find the few offers worth your time out of hundreds. The system strongly recommends against applying to anything scoring below 4.0/5. Your time is valuable, and so is the recruiter's. Always review before submitting.
                - paragraph [ref=e1256]: "Career-ops is agentic: Claude Code navigates career pages with Playwright, evaluates fit by reasoning about your CV vs the job description (not keyword matching), and adapts your resume per listing."
                - blockquote [ref=e1257]:
                  - paragraph [ref=e1258]:
                    - strong [ref=e1259]: "Heads up: the first evaluations won't be great."
                    - text: "The system doesn't know you yet. Feed it context -- your CV, your career story, your proof points, your preferences, what you're good at, what you want to avoid. The more you nurture it, the better it gets. Think of it as onboarding a new recruiter: the first week they need to learn about you, then they become invaluable."
                - paragraph [ref=e1260]:
                  - text: Built by someone who used it to evaluate 740+ job offers, generate 100+ tailored CVs, and land a Head of Applied AI role.
                  - link "Read the full case study" [ref=e1261] [cursor=pointer]:
                    - /url: https://santifer.io/career-ops-system
                  - text: .
