                  - textbox [ref=e153]:
                    - heading "소개" [level=3] [ref=e154]
                    - paragraph [ref=e155]: ㈜비욘드메디슨은 인지 행동 치료(Cognitive Behavioral Therapy, CBT)를 기반으로 한 턱관절 장애 관리 디지털 치료제(DTx)를 개발하는 헬스케어 스타트업입니다. 전 세계적으로 매년 2억 명 이상의 턱관절 장애 환자가 발생하는 가운데, 비욘드메디슨은 장치 치료에 앞서 환자들이 효과적으로 증상을 관리할 수 있는 디지털 관리 프로그램을 제공합니다. 턱관절 장애를 시작으로 얼굴 영역에서의 다양한 질환을 치료하는 솔루션과 치과 분야의 다양한 헬스케어 솔루션으로 확장하고 있습니다.
                    - paragraph [ref=e156]
                    - heading "담당업무" [level=3] [ref=e157]
                    - paragraph [ref=e158]: • Restful API 설계 및 개발 • MSA 기반 gRPC API 설계 및 개발 • CI/CD 파이프라인 설계 및 AWS 인프라 구축 • 의료기기 품질경영시스템에 따른 체계적인 문서화 작업 • 제품 출시 후 데이터 기반 분석 및 개선 방안 기획 • 프로젝트 문제 진단 및 해결 방안 정의
                    - paragraph [ref=e159]
                    - heading "자격요건" [level=3] [ref=e160]
                    - paragraph [ref=e161]: • Kotlin 2년 이상 경험 또는 그에 준하는 실력을 갖추신 분 • Spring Security, JPA 등 Spring Framework(Spring Boot)에 대한 깊은 이해가 있으신 분 • Restful API 설계 및 개발 경험이 있으신 분 • 데이터베이스(MySQL) 설계 및 관리 경험이 있으신 분 • Git을 활용한 형상관리 경험이 있으신 분 • 테스트 코드의 중요성을 이해하고 주도적으로 작성하시는 분 • 사이버보안과 식약처 인허가 요구사항 등에 따른 문서화 작업에 열린 마음을 가지신 분 • 상용 서비스를 운영하며 지속적으로 유지보수한 경험이 있으신 분 • 특정 언어나 기술에 국한되지 않는 마인드를 가지신 분 • 새로운 기술과 도구에 열린 마음을 가지고, 이를 학습하여 실무에 적용할 수 있는 능력을 가지신 분 • 협업과 존중을 바탕으로 한 명확하고 적극적인 의사소통 능력을 가지신 분 • 자신이 맡은 개발 업무에 대한 책임감이 있으신 분 • 자신의 삶에 대해 능동적이고 적극적인 태도를 가지신 분
                    - paragraph [ref=e162]
                    - heading "우대사항" [level=3] [ref=e163]
                    - paragraph [ref=e164]: • MSA 기반 gRPC API 설계 및 개발 경험이 있으신 분 • CI/CD 파이프라인 설계 및 AWS 인프라 구축 경험이 있으신 분 • TDD 방식으로 프로젝트를 진행한 경험이 있으신 분 • Rust 언어를 활용한 개발 경험이 있으신 분 • 글로벌 서비스 런칭 및 유지보수 경험이 있으신 분 • 예약 및 결제 시스템 개발 경험이 있으신 분 • 문서화 자동화 도구(Jira, Confluence, Swagger 등) 경험이 있으신 분 • 팀 내 새로운 기술 도입과 기술 공유 문화를 주도적으로 이끌어 보신 분 • 코드 리뷰 및 페어 프로그래밍을 통한 팀 내 성장 문화를 이끌어 보신 분 • 시큐어 코딩 경험이 있으신 분
                    - paragraph [ref=e165]
                    - heading "혜택 및 복지" [level=3] [ref=e166]
                    - paragraph [ref=e167]: "채용 형태: 정규직 (수습 3개월 후 정규직 전환) 유연 근무 제도: 오전 8-11시 사이 자율 출근 (주 40시간) 주 1회 재택근무 점심 및 저녁 식대 제공 스낵바 제공 (각종 과자, 커피, 견과류 등) 듀얼 모니터, 최신 개발 장비 지급 (Mac) 업무에 필요한 소프트웨어 구입비 지원 자유로운 연차(반차, 반반차) 사용 및 미사용 연차에 대해 수당 지급 자기 계발을 위한 도서 구입, 교육 관련 적극적 지원 자율 복장으로 편안하게 일할 수 있는 환경 수평적인 호칭(-님) 사용 월 1-2회 점심 회식 강남역 3분거리 초역세권 4대 보험 가입 중소기업 취업자 90% 소득세 감면 제도 활용"
                    - paragraph [ref=e168]
                    - heading "기술스택" [level=3] [ref=e169]
                    - paragraph [ref=e170]: Kotlin, Spring, AWS
                    - paragraph [ref=e171]
                    - heading "기타" [level=3] [ref=e172]
                    - paragraph [ref=e173]: 빠르게 성장하고 있는 소프트웨어 의료기기 인허가 및 글로벌 진출 경험! 시리즈A - IPO까지 빠르게 성장하는 초기 멤버로 몸담아볼 수 있는 기회! 함께하실 분을 모십니다.
