# Portal Scanner Configuration
# Focused on Korean Backend Engineering roles (practical matching, not overly strict)

title_filter:
  positive:
    - "Backend"
    - "Back-end"
    - "Server"
    - "백엔드"
    - "서버"
    - "API"
    - "REST"
    - "Node.js"
    - "Python"
    - "Go"
    - "Golang"
    - "Kotlin"
    - "Java "
    - "Spring"
    - "Spring Boot"
    - "JPA"
    - "MySQL"
    - "Redis"
  negative:
    # Filter out non-backend roles
    - "Frontend"
    - "프론트엔드"
    - "iOS"
    - "Android"
    - "QA"
    - "Data Engineer"
    - "Machine Learning"
    - "ML"
    - "Data Scientist"
    - "Security Engineer"
    - "Software Engineer, Data"
    - "Sales"
    - "HR"
    - "Marketing"
    - "Recruiter"
    - "Product Manager"
    - "Design"
    - "UX"
    - "Blockchain"
    - "Web3"
    - "Crypto"
    
    # Filter out wrong seniority (Junior/Intern)
    - "Junior"
    - "Intern"
    - "인턴"
    - "Senior"
    - "Sr"
    - "Staff"
    - "Principal"
    - "Lead"
    - "Manager"
    - "Director"
    - "Head"
    - "팀장"
    - "Expression of Interest"
    - "채용관심등록"
    
  seniority_boost:
    - "Senior"
    - "Sr"
    - "Mid"
    - "Mid-level"
    - "미들"

search_queries:
  - name: Wanted — Java Spring Backend 3+
    query: 'site:www.wanted.co.kr/wd "백엔드" "Java" "Spring" "3년" -지원마감 -프론트엔드 -Senior -Staff -Lead'
    enabled: true

  - name: Wanted — Backend Engineer Korea
    query: 'site:www.wanted.co.kr/wd "Backend Engineer" "Java" OR "Kotlin" OR "Spring" "3년 이상" -지원마감 -Senior -Staff -Lead'
    enabled: true

  - name: Lever — Korea Backend
    query: 'site:jobs.lever.co "Seoul" OR "Korea" OR "한국" OR "서울" "Backend" OR "백엔드" OR "Server" OR "서버" -Senior -Staff -Lead'
    enabled: true
    
  - name: Greenhouse — Korea Backend
    query: 'site:boards.greenhouse.io OR site:job-boards.greenhouse.io "Seoul" OR "Korea" OR "한국" OR "서울" "Backend" OR "백엔드" OR "Server" OR "서버" -Senior -Staff -Lead'
    enabled: true

  - name: Ashby — Korea Backend
    query: 'site:jobs.ashbyhq.com "Seoul" OR "Korea" OR "한국" OR "서울" "Backend" OR "백엔드" OR "Server" OR "서버" -Senior -Staff -Lead'
    enabled: true

  - name: Workable — Korea Backend
    query: 'site:apply.workable.com "Seoul" OR "Korea" OR "한국" OR "서울" "Backend" OR "백엔드" OR "Server" OR "서버" -Senior -Staff -Lead'
    enabled: true

  - name: Wellfound — Korea Backend
    query: 'site:wellfound.com "Seoul" OR "Korea" OR "한국" OR "서울" "Backend" OR "백엔드" OR "Server" OR "서버" -Senior -Staff -Lead'
    enabled: true

tracked_companies:

  - name: a16z speedrun talent network
    provider: a16z-speedrun-talent
    max_pages: 3
    q: backend
    enabled: true

  - name: Agentic AI Jobs
    provider: agentic-jobs
    enabled: true

  - name: Naver Cafe Workhub
    careers_url: https://cafe.naver.com/f-e/cafes/31258781/menus/8?viewType=L
    api: https://apis.naver.com/cafe-web/cafe-boardlist-api/v1/cafes/31258781/menus/8/articles?perPage=100&page=1
    enabled: true

  - name: Naver Cafe Workhub p2
    careers_url: https://cafe.naver.com/f-e/cafes/31258781/menus/8?viewType=L
    api: https://apis.naver.com/cafe-web/cafe-boardlist-api/v1/cafes/31258781/menus/8/articles?perPage=100&page=2
    enabled: true

  - name: Naver Cafe Workhub p3
    careers_url: https://cafe.naver.com/f-e/cafes/31258781/menus/8?viewType=L
    api: https://apis.naver.com/cafe-web/cafe-boardlist-api/v1/cafes/31258781/menus/8/articles?perPage=100&page=3
    enabled: true

  - name: Naver Cafe Workhub p4
    careers_url: https://cafe.naver.com/f-e/cafes/31258781/menus/8?viewType=L
    api: https://apis.naver.com/cafe-web/cafe-boardlist-api/v1/cafes/31258781/menus/8/articles?perPage=100&page=4
    enabled: true

  - name: Naver Cafe Workhub p5
    careers_url: https://cafe.naver.com/f-e/cafes/31258781/menus/8?viewType=L
    api: https://apis.naver.com/cafe-web/cafe-boardlist-api/v1/cafes/31258781/menus/8/articles?perPage=100&page=5
    enabled: true

  - name: Zighang Recruitment
    careers_url: https://zighang.com/recruitment
    parser:
      command: node
      script: scripts/parsers/zighang-recruitment-jobs.mjs
      format: jobs-json-v1
      timeout_ms: 120000
    enabled: true

  - name: Saramin Backend Search
    careers_url: https://www.saramin.co.kr/zf_user/search/recruit
    parser:
      command: node
      script: scripts/parsers/saramin-backend-search.mjs
      format: jobs-json-v1
      timeout_ms: 120000
    enabled: true

  - name: Riiid
    careers_url: https://boards.greenhouse.io/riiid
    api: https://boards-api.greenhouse.io/v1/boards/riiid/jobs
    enabled: false

  - name: Lunit
    careers_url: https://job-boards.greenhouse.io/lunit
    api: https://boards-api.greenhouse.io/v1/boards/lunit/jobs
    enabled: false
