# Portal Scanner Configuration
# Focused on Korean Data/Batch Backend and pragmatic Data Engineering roles

location_filter:
  allow:
    - "korea"
    - "south korea"
    - "seoul"
    - "한국"
    - "서울"
    - "성남"
    - "분당"
    - "판교"
    - "pangyo"
    - "gyeonggi"
    - "경기"
    - "인천"
    - "부산"
    - "대구"
    - "대전"
    - "광주"
    - "n/a"

title_filter:
  positive:
    - "Backend"
    - "Back-end"
    - "Server"
    - "백엔드"
    - "서버"
    - "API"
    - "REST"
    - "Node.js"
    - "Python"
    - "Go"
    - "Golang"
    - "Kotlin"
    - "Java "
    - "Spring"
    - "Spring Boot"
    - "JPA"
    - "MySQL"
    - "Redis"
    - "Data Engineer"
    - "Data Platform"
    - "Data Pipeline"
    - "ETL"
    - "ELT"
    - "Batch"
    - "Airflow"
    - "Ingestion"
    - "데이터 엔지니어"
    - "데이터 플랫폼"
    - "데이터 파이프라인"
    - "배치"
    - "파이프라인"
  negative:
    # Filter out non-backend roles
    - "Frontend"
    - "프론트엔드"
    - "iOS"
    - "Android"
    - "QA"
    - "Machine Learning"
    - "ML"
    - "Data Scientist"
    - "Data Analyst"
    - "Analytics Engineer"
    - "Analyst"
    - "Business Intelligence"
    - "BI Analyst"
    - "BI Engineer"
    - "BI Data Engineer"
    - "Security Engineer"
    - "SRE"
    - "Site Reliability"
    - "Architect"
    - "Databricks"
    - "Sales"
    - "HR"
    - "Marketing"
    - "Recruiter"
    - "Product Manager"
    - "Design"
    - "UX"
    - "Blockchain"
    - "Web3"
    - "Crypto"
    - "분석가"
    - "데이터 분석"
    - "데이터 사이언티스트"
    - "리서치"
    - "시니어"
    - "신입"
    - "주니어"
    - "아키텍트"
    
    # Filter out wrong seniority (Junior/Intern)
    - "Junior"
    - "Intern"
    - "인턴"
    - "Senior"
    - "Sr"
    - "Junior"
    - "Staff"
    - "Principal"
    - "Lead"
    - "Manager"
    - "Director"
    - "Head"
    - "팀장"
    - "Expression of Interest"
    - "채용관심등록"
    
  seniority_boost:
    - "Senior"
    - "Sr"
    - "Mid"
    - "Mid-level"
    - "미들"

search_queries:
  - name: Wanted — Data/Batch Backend 3+
    query: 'site:www.wanted.co.kr/wd ("백엔드" OR "서버" OR "Backend Engineer" OR "Data Engineer") ("Java" OR "Spring" OR "Python" OR "Airflow" OR "ETL" OR "Batch") ("3년" OR "3년 이상") -지원마감 -프론트엔드 -Senior -Staff -Lead -Analyst -Data Scientist'
    enabled: true

  - name: Wanted — Data Engineer Airflow Korea
    query: 'site:www.wanted.co.kr/wd ("Data Engineer" OR "데이터 엔지니어") ("Airflow" OR "ETL" OR "ELT" OR "Pipeline" OR "배치") -지원마감 -Senior -Staff -Lead -Analyst -Data Scientist'
    enabled: true

  - name: Wanted — Backend Engineer Korea
    query: 'site:www.wanted.co.kr/wd ("Backend Engineer" OR "백엔드") ("Java" OR "Kotlin" OR "Spring") ("3년 이상" OR "3년") -지원마감 -Senior -Staff -Lead'
    enabled: true

  - name: Lever — Korea Data/Batch Backend
    query: 'site:jobs.lever.co ("Seoul" OR "Korea" OR "한국" OR "서울") ("Backend" OR "백엔드" OR "Server" OR "서버" OR "Data Engineer" OR "데이터 엔지니어" OR "Airflow" OR "ETL") -Senior -Staff -Lead -Analyst -Data Scientist'
    enabled: true
    
  - name: Greenhouse — Korea Data/Batch Backend
    query: 'site:boards.greenhouse.io OR site:job-boards.greenhouse.io ("Seoul" OR "Korea" OR "한국" OR "서울") ("Backend" OR "백엔드" OR "Server" OR "서버" OR "Data Engineer" OR "데이터 엔지니어" OR "Airflow" OR "ETL") -Senior -Staff -Lead -Analyst -Data Scientist'
    enabled: true

  - name: Ashby — Korea Data/Batch Backend
    query: 'site:jobs.ashbyhq.com ("Seoul" OR "Korea" OR "한국" OR "서울") ("Backend" OR "백엔드" OR "Server" OR "서버" OR "Data Engineer" OR "데이터 엔지니어" OR "Airflow" OR "ETL") -Senior -Staff -Lead -Analyst -Data Scientist'
    enabled: true

  - name: Workable — Korea Data/Batch Backend
    query: 'site:apply.workable.com ("Seoul" OR "Korea" OR "한국" OR "서울") ("Backend" OR "백엔드" OR "Server" OR "서버" OR "Data Engineer" OR "데이터 엔지니어" OR "Airflow" OR "ETL") -Senior -Staff -Lead -Analyst -Data Scientist'
    enabled: true

  - name: Wellfound — Korea Data/Batch Backend
    query: 'site:wellfound.com ("Seoul" OR "Korea" OR "한국" OR "서울") ("Backend" OR "백엔드" OR "Server" OR "서버" OR "Data Engineer" OR "데이터 엔지니어" OR "Airflow" OR "ETL") -Senior -Staff -Lead -Analyst -Data Scientist'
    enabled: true

