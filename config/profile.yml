      - "Redis 기반 실시간 매칭 구현, 1인 서비스 완성, 인프라 및 네트워크 트러블슈팅 경험"
      - "AI/LLM을 서비스 설계, 구현, 디버깅 전반에 걸친 생산성 승수로 활용"
