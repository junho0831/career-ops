narrative:
  headline: "로봇시스템공학 전공 및 반도체 공정 1,973만 건 로그 파이프라인 최적화 경험을 갖추고, 중견·대기업 제조업 및 스마트팩토리의 데이터 정합성과 안정성을 개선하는 Data/Batch Backend Engineer"
  exit_story: "로봇시스템공학과를 졸업하고 회사 실무에서 반도체 공정 ER Dose 로그 파이프라인을 개선했습니다. 약 1,973만 건 RAW 작업의 기록된 운영 비교에서 처리 시간을 30.6% 단축했으며, DIE 수율·불량 유형 및 EUV Root Cause의 일별 집계와 날짜별 재처리 흐름을 구현했습니다. 설비 데이터 수집·적재, 검색 장애 대응 DB fallback, Redis 인증 상태 관리, RDB 제약 조건, 관리자 재처리 API를 다뤘습니다. 개인 서비스 VoiceLink에서는 Redis 원자적 선점, DB Outbox, 선택형 RabbitMQ 우선 발행과 Redis 대체 경로, WebRTC 및 Docker/인프라 운영을 통해 실시간 상태와 결과 전달을 개선했습니다."
  superpowers:
    - "설계부터 구현, 배포, 운영까지 백엔드 시스템 전체 라이프사이클에 대한 높은 오너십"
    - "AI를 적극 활용한 1인 개발로 아키텍처 및 운영 주도권을 유지하면서도 빠른 구현, 디버깅, 문서화 및 이터레이션 달성"
    - "Fallback 설계, Redis 상태 관리, RDB 제약 조건, 복구 가능한 파일 처리(Batch/Airflow)를 통한 시스템 안정성 확보"
    - "실무에서의 Spring 관리자 API 구축, 예외/검증 정책 표준화, Elasticsearch Fallback 대응, Redis 인증 관리, CI/CD 구축, Airflow 자동화, 운영 로그 파싱, 재처리 파이프라인 경험"
    - "야근 신청·승인, 사원 관리, 검색 인덱싱, 알림, 배치 실행, 배포 검증 등 운영 도구 및 워크플로우에 대한 백엔드 주도 경험"
    - "지표 기반 디버깅, 리팩토링 및 신뢰성 향상 역량"
    - "Redis, JWT, OAuth2를 활용한 인증 및 세션 정합성 설계 경험"
    - "Spring Boot, Redis, LiveKit/WebRTC, Docker, Nginx, SSL, DNS 구성을 포괄하는 실시간 서비스 직접 운영"
    - "트랜잭션 경계, 락(Lock), 고유 제약 조건(Unique Constraints), Outbox 패턴을 활용한 RDB 데이터 정합성 보장"
    - "Redis Lua Script 기반 원자적 상대 선점, Presence TTL + ZSET 대기열, Cancel Marker, DB Outbox + TTL 결과 키, 선택형 RabbitMQ 우선 발행과 Redis Pub/Sub 대체 경로, FOR UPDATE SKIP LOCKED 및 lease token 기반 선점·완료 제어, 지수 백오프 재시도, PESSIMISTIC_WRITE 세션 종료, DeferredResult 스코프 제어 경험"
  positioning:
    primary: "Airflow 기반 데이터 처리 자동화, 단일 FTP task 내부의 수집/검증/변환/적재 흐름, RUPI 이미지 메타데이터 source_file unique+upsert, 업로드·DB commit 이후 원본 삭제, ER Dose chunk/partition COPY 적재와 날짜별 집계 교체, 관리자 재처리 API, 검색 Fallback에 강점을 둔 데이터/배치 지향 백엔드 엔지니어"
    strong_signals:
      - "Airflow 기반 데이터 워크플로우 자동화, FTP 파일 처리, 로그 파싱, 구조화 적재, 재실행 가능한 배치 설계"
      - "RUPI 이미지 메타데이터의 source_file unique+upsert, FTP 결합 처리의 업로드·DB commit 이후 원본 삭제, ER Dose chunk 및 range partition COPY 적재. 일별 집계는 별도 DELETE 후 INSERT로 교체하며 중간 실패 시 재시도 필요"
      - "백엔드 운영, 유지보수 및 사내 도구 프로덕션화 경험"
      - "장애 원인 분석(RCA), 반복 오류 방지 설계 및 회귀 테스트(Regression Tests)"
      - "배치 최적화, 인증 시스템, 검색 고도화, 관리자 API, Redis 및 RDB 정합성 보장"
      - "Redis 기반 실시간 매칭 구현, 1인 서비스 완성, 인프라 및 네트워크 트러블슈팅 경험"
      - "AI/LLM을 서비스 설계, 구현, 디버깅 전반에 걸친 생산성 승수로 활용"
    weak_or_deemphasized_signals:
      - "초대규모 대용량 트래픽 처리 경험"
      - "빅테크 스케일 플랫폼 경험"
      - "거대 MSA 아키텍처 리드 경험"
      - "도메인 주도 설계(DDD) 아키텍처 리딩"
  proof_points:
    - name: "VoiceLink 실시간 매칭 및 음성 통화 서비스"
      url: "https://voice-link.co.kr"
      hero_metric: "Spring Boot·Redis Lua 기반 원자적 매칭, DB Outbox + TTL 결과 키, 선택형 RabbitMQ 우선 발행 및 Redis Pub/Sub 대체 경로 구현. 2026년 7월 FOR UPDATE SKIP LOCKED 기반 lease 선점·token 검증·지수 백오프 재시도 개선. DB 종료 상태와 PESSIMISTIC_WRITE를 기준으로 세션 종료를 처리하고 LiveKit·Docker·Nginx/SSL을 직접 구성한 AI 보조 1인 서비스"
