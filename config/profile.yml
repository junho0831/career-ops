narrative:
  headline: "AI를 활용한 1인 개발 생산성 극대화, Spring 안정성, Redis 상태 정합성 보장, 데이터 파이프라인 자동화, 운영 로그 파싱, 실시간 서비스 운영 경험을 보유한 백엔드 엔지니어"
  exit_story: "회사 프로젝트와 개인 실시간 서비스를 통해 설계부터 배포, 운영까지 전 과정을 주도적으로 수행했습니다. 실무에서는 Spring Boot 관리자 API 개발, Elasticsearch 장애 대비 DB Fallback 적용, Redis TTL 기반 Refresh Token 수명 주기 관리, RDB 인덱싱 및 Unique 제약 조건을 활용한 성능 개선, 전역 예외 처리(GlobalExceptionHandler) 및 응답 표준화, GitLab CI/CD 파이프라인 구축, Airflow 기반 FTP 데이터 처리 자동화, ER Dose RAW/EUV 로그 파싱 배치 분리, 운영 로그 구조화 적재, 배치 재처리 API 구현 등의 경험을 쌓았습니다. 개인 프로젝트인 VoiceLink(voice-link.co.kr)에서는 AI 보조 개발을 통해 1인 개발의 한계를 극복하며 Redis Lua Script를 활용한 원자적 매칭, DB Outbox 패턴, FOR UPDATE SKIP LOCKED, PESSIMISTIC_WRITE를 활용한 동시성 제어 및 세션 관리, WebRTC, Docker, Nginx, SSL, DNS 설정 및 네트워크 트러블슈팅 등 실시간 분산 상태 관리 및 인프라 운영을 성공적으로 수행했습니다."
  superpowers:
    - "설계부터 구현, 배포, 운영까지 백엔드 시스템 전체 라이프사이클에 대한 높은 오너십"
    - "AI를 적극 활용한 1인 개발로 아키텍처 및 운영 주도권을 유지하면서도 빠른 구현, 디버깅, 문서화 및 이터레이션 달성"
    - "Fallback 설계, Redis 상태 관리, RDB 제약 조건, 복구 가능한 파일 처리(Batch/Airflow)를 통한 시스템 안정성 확보"
    - "실무에서의 Spring 관리자 API 구축, 예외/검증 정책 표준화, Elasticsearch Fallback 대응, Redis 인증 관리, CI/CD 구축, Airflow 자동화, 운영 로그 파싱, 재처리 파이프라인 경험"
    - "야근 신청·승인, 사원 관리, 검색 인덱싱, 알림, 배치 실행, 배포 검증 등 운영 도구 및 워크플로우에 대한 백엔드 주도 경험"
    - "지표 기반 디버깅, 리팩토링 및 신뢰성 향상 역량"
    - "Redis, JWT, OAuth2를 활용한 인증 및 세션 정합성 설계 경험"
    - "Spring Boot, Redis, LiveKit/WebRTC, Docker, Nginx, SSL, DNS 구성을 포괄하는 실시간 서비스 직접 운영"
    - "트랜잭션 경계, 락(Lock), 고유 제약 조건(Unique Constraints), Outbox 패턴을 활용한 RDB 데이터 정합성 보장"
    - "Redis Lua Script 기반 원자적 상대 선점, Presence TTL + ZSET 대기열 관리, Cancel Marker 동시성 방어, DB Outbox + Redis Pub/Sub 메시징, FOR UPDATE SKIP LOCKED 기반 Outbox 선점, PESSIMISTIC_WRITE 세션 종료, DeferredResult 스코프 제어 및 CallSession.ended_at 기반 세션 정합성을 아우르는 분산 상태 설계 역량"
  positioning:
    primary: "안정성, 상태 정합성 보장, 인증 관리, 검색 Fallback 전략, 배치 안전성, 관리자 API, CI/CD 파이프라인 구축, 장애 추적 워크플로우, 그리고 AI 보조를 통한 생산성 극대화에 강점을 둔 운영 지향 백엔드 엔지니어"
    strong_signals:
